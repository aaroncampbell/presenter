name: Quality

on:
    pull_request:
    push:
        branches:
            - main
            - 'modernization/**'

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php-quality:
        name: PHP quality (8.3)
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run PHP quality checks
              run: composer check

            - name: Check WordPress coding standards
              run: composer phpcs

            - name: Audit Composer dependencies
              run: composer check:audit

    php-runtime:
        name: PHP syntax (${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.3'
                    - '8.4'
                    - '8.5'
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Check PHP syntax
              run: composer lint

    javascript-quality:
        name: JavaScript quality
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Node.js
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Run JavaScript quality checks
              run: npm run check

            - name: Build production assets and release package
              run: npm run release:build

            - name: Verify committed build output
              run: git diff --exit-code -- build

            - name: Verify release package
              run: npm run release:verify

            - name: Audit production npm dependencies
              run: npm audit --omit=dev

    wordpress-integration:
        name: WordPress 7.0.1 integration
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository and legacy Reveal baseline
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  submodules: recursive

            - name: Set up PHP
              uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Set up Node.js
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: |
                  composer install --no-interaction --no-progress --prefer-dist
                  npm ci

            - name: Start WordPress
              run: npm run env:start

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - name: Run PHP integration tests
              run: npm run test:php

            - name: Verify feature-aware Reveal plugin loading
              run: npm run test:plugin-selection-runtime

            - name: Run cross-browser accessibility smoke test
              run: npm run test:e2e

            - name: Check assembled release plugin
              run: |
                  npm run release:build
                  npm run plugin-check:release

            - name: Stop WordPress
              if: always()
              run: npm run env:stop
